<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BB Training Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../components/styles.css" />
</head>
<body>

<div class="login-page">
  <div style="width:100%;max-width:26rem;">

    <!-- Card -->
    <div class="login-card">
      <div class="login-logo">BB</div>
      <h1 class="login-title">BB Training Portal</h1>
      <p class="login-subtitle">Sign in to manage your training records</p>

      <form onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label class="label label-required" for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="email" class="input has-icon-left" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between">
            <label class="label label-required" for="password">Password</label>
            <a href="#" class="text-sm" style="color:var(--muted-fg);font-size:0.8125rem;">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="password" class="input has-icon-left" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-default w-full" style="height:2.5rem;margin-top:0.25rem;">
          Sign In
        </button>
      </form>

      <!-- Demo shortcuts -->
      <div style="margin-top:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;font-size:0.75rem;color:var(--muted-fg);margin-bottom:0.875rem;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          or continue as
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>
        <div style="position:relative;">
          <button class="btn btn-outline w-full" data-dropdown="demo-menu" style="justify-content:space-between;">
            <span style="display:flex;align-items:center;gap:0.5rem;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1rem;height:1rem;"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
              Select a demo role…
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:0.875rem;height:0.875rem;color:var(--muted-fg);flex-shrink:0;"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu" id="demo-menu" style="width:100%;top:calc(100% + 0.25rem);">
            <div class="dropdown-label">Demo roles</div>
            <a href="officer.html" class="dropdown-item">
              <div class="avatar avatar-sm" style="background:#dbeafe;color:#1d4ed8;width:1.5rem;height:1.5rem;font-size:0.6rem;flex-shrink:0;">TG</div>
              <div><div style="font-weight:500;">Officer</div><div style="font-size:0.75rem;color:var(--muted-fg);">Theodor Gunawan · LTA · Alpha Co.</div></div>
            </a>
            <a href="captain.html" class="dropdown-item">
              <div class="avatar avatar-sm" style="background:#dcfce7;color:#166534;width:1.5rem;height:1.5rem;font-size:0.6rem;flex-shrink:0;">JS</div>
              <div><div style="font-weight:500;">Captain</div><div style="font-size:0.75rem;color:var(--muted-fg);">John Seet · Alpha Co.</div></div>
            </a>
            <a href="chaplain.html" class="dropdown-item">
              <div class="avatar avatar-sm" style="background:#fef9c3;color:#713f12;width:1.5rem;height:1.5rem;font-size:0.6rem;flex-shrink:0;">JG</div>
              <div><div style="font-weight:500;">Chaplain</div><div style="font-size:0.75rem;color:var(--muted-fg);">Joseph Goh</div></div>
            </a>
            <a href="comm.html" class="dropdown-item">
              <div class="avatar avatar-sm" style="background:#fef3c7;color:#b45309;width:1.5rem;height:1.5rem;font-size:0.6rem;flex-shrink:0;">WT</div>
              <div><div style="font-weight:500;">Training Comm</div><div style="font-size:0.75rem;color:var(--muted-fg);">Wendy Tio</div></div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <p style="text-align:center;font-size:0.75rem;color:var(--muted-fg);margin-top:1.25rem;">
      Boys' Brigade Singapore · Training Management System
    </p>
  </div>
</div>

<script src="../components/components.js"></script>
<script src="../data/data.js"></script>
<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.toLowerCase();
  if (email.includes('comm') || email.includes('admin') || email.includes('tio')) {
    window.location.href = 'comm.html';
  } else if (email.includes('capt') || email.includes('captain')) {
    window.location.href = 'captain.html';
  } else if (email.includes('chap') || email.includes('chaplain')) {
    window.location.href = 'chaplain.html';
  } else {
    window.location.href = 'officer.html';
  }
}
</script>
</body>
</html>
